version: 2
updates:
  - package-ecosystem: pip
    directory: /grapevision
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, grapevision]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
