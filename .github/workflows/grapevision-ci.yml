name: grapevision CI

on:
  push:
    branches: [main]
    paths:
      - "grapevision/**"
      - ".github/workflows/grapevision-ci.yml"
      - ".pre-commit-config.yaml"
  pull_request:
    paths:
      - "grapevision/**"
      - ".github/workflows/grapevision-ci.yml"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: grapevision

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: grapevision/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check --output-format=github .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest   # the team develops on Windows
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: grapevision/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: pytest (CPU; GPU backends are faked)
        run: pytest -m "not gpu" --cov --cov-report=xml --cov-report=term --junitxml=junit.xml
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: test-reports
          path: |
            grapevision/coverage.xml
            grapevision/junit.xml

  build:
    name: Build & install check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel into a clean venv and import it
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv venv
          venv/bin/pip install "$GITHUB_WORKSPACE"/grapevision/dist/*.whl
          venv/bin/python -c "import grapevision; from grapevision.config import load_config; load_config(); print(grapevision.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: grapevision/dist/

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1   # runs --all-files; the config scopes hooks to grapevision/ and CI files
