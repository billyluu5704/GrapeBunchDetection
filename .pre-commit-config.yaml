# Install once per clone:  pip install pre-commit && pre-commit install
# Hooks only touch grapevision/ and the CI config; the older notebooks are left as they are.
files: ^(grapevision/|\.github/|\.pre-commit-config\.yaml$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files   # keeps photos, videos and model weights out of git
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
